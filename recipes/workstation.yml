---
name: workstation
description: Opiniated Kinoite
base-image: ghcr.io/blue-build/base-images/fedora-kinoite
image-version: 45
modules:
  - type: files
    files:
      - source: system/etc/
        destination: /etc/
  - type: dnf
    repos:
      files: 
        - https://download.opensuse.org/repositories/home:paulmcauley/Fedora_45/home:paulmcauley.repo
        - https://download.opensuse.org/repositories/home:luisbocanegra/Fedora_45/home:luisbocanegra.repo
        - https://brave-browser-rpm-release.s3.brave.com/brave-browser.repo
        - https://negativo17.org/repos/fedora-steam.repo
        - https://negativo17.org/repos/fedora-multimedia.repo
      copr:
        enable:
          - atim/starship
          - lizardbyte/beta
    install:
      packages:
        - https://github.com/Vencord/Vesktop/releases/download/v1.7.0/vesktop-1.7.0.x86_64.rpm
        - klassy
        - kde-material-you-colors
        - adw-gtk3-theme
        - brave-browser
        - Sunshine
        - fastfetch
        - kontact
        - KColorChooser
        - kolourpaint
        - kcalc
        - haruna
        - krecorder
        - ksystemlog
        - okular
        - kamoso
        - haruna
        - isoimagewriter
        - gwenview
        - zsh
        - zsh-autosuggestions
        - zsh-syntax-highlighting
        - starship
        - steam
        - steam-devices
  - type: bling
    install:
       - 1password
  - type: systemd
    user:
      enabled:
        - app-dev.lizardbyte.app.Sunshine.service
  - type: default-flatpaks
    configurations:
      - notify: false
        scope: system
        repo:
          title: Flathub (system)
  - type: signing
