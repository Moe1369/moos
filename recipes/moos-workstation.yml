name: moos-workstation
description: Opiniated Silverblue
base-image: ghcr.io/ublue-os/silverblue-main
image-version: 45
modules:
  - type: files
    files:
      - source: system/etc/
        destination: /etc/
  - type: dnf
    repos:
      files: 
        - https://negativo17.org/repos/fedora-steam.repo
        - https://brave-browser-rpm-release.s3.brave.com/brave-browser.repo
      copr:
        enable:
          - atim/starship
          - lizardbyte/beta
    install:
      packages:
        - https://github.com/lemonade-sdk/lemonade/releases/download/v2026.46.2/lemonade-server-2026.46.2-fc44.x86_64.rpm
        - adw-gtk3-theme
        - rocm
        - llama-cpp
        - gnome-software
        - gnome-software-rpm-ostree
        - brave-browser
        - Sunshine
        - fastfetch
        - zsh
        - zsh-autosuggestions
        - zsh-syntax-highlighting
        - starship
        - steam
        - steam-devices
    remove:
      packages:
        - firefox
        - firefox-langpacks
        - nvtop
        - htop
  - type: bling
    install:
      - 1password
  - type: systemd
    user:
      enabled:
        - app-dev.lizardbyte.app.Sunshine.service
  - type: default-flatpaks
    configurations:
      - notify: false
        scope: system
        repo:
          title: Flathub (system)
  - type: signing
